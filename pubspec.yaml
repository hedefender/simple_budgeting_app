name: simple_budgeting_app
description: Privacy-first, fully local personal budgeting app.
publish_to: "none"
version: 0.1.0+1

environment:
  # drift 2.35 requires Dart >= 3.10. Flutter 3.47.x ships Dart 3.13.x.
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Versions verified against pub.dev / release notes (October 2026):
  flutter_riverpod: ^3.4.1
  get_it: ^9.2.1
  drift: ^2.35.0

  # Not pinned yet: pub picks the newest compatible versions.
  # After the first `flutter pub get`, run `dart pub upgrade --tighten`
  # to rewrite these into normal ^x.y.z constraints.
  drift_flutter: any
  intl: any
  rust_lib_simple_budgeting_app:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  drift_dev: any

flutter:
  uses-material-design: true
  generate: true # enables `flutter gen-l10n` (see l10n.yaml)
